fy risk with an explainable Zero Trust model, and produce a decision plus response plan — while a human stays in the loop for every high-impact action.",objectives:["Build a multi-agent architecture (Orchestrator + 5 specialized agents) that autonomously investigates security incidents end-to-end.","Implement an explainable, deterministic Zero Trust risk engine with transparent weights and auditable decisions.","Simulate realistic AWS-style cloud telemetry (ALB, ECS, EC2, RDS, ECR, IAM, VPC, SG) without requiring real credentials.","Demonstrate observable agentic behavior: streaming investigation traces, per-agent task/duration/result records.","Generate professional incident reports with evidence, root cause, response plan and lessons learned.","Maintain a complete append-only audit trail of every agent action.","Remain fully functional without any external AI API key (deterministic fallback logic).","Deliver classroom-ready demonstration assets: one-click scenarios, demo script, PPT and viva preparation."],existingSystem:"Traditional SOC tooling falls into three categories: (1) SIEM platforms (Splunk, QRadar) that aggregate and display logs but rely on analyst-driven queries and playbooks; (2) SOAR platforms that execute pre-defined, rigid playbooks with little contextual reasoning; (3) cloud-native security dashboards (GuardDuty, Security Hub) that surface findings per-service without cross-domain correlation or risk-based access decisions. Across all three, investigation remains manual: analysts pivot between consoles, correlation is ad-hoc, and risk triage is inconsistent. None provide an autonomous, explainable investigation workflow that spans cloud telemetry, identity, device posture and network signals in one flow.",proposedSystem:"AegisOps proposes a layered agentic platform: an Orchestrator Agent receives each incident, classifies it, and delegates to specialized agents (Cloud Analyst, Security Analyst, Zero Trust Agent) that query a shared tool system over simulated cloud/identity/network data. Evidence is correlated centrally, a deterministic weighted risk engine produces a 0–100 score with full factor decomposition, and a policy engine maps the score to an access decision (ALLOW / MONITOR / STEP-UP / DENY-ISOLATE). The Incident Response Agent converts the decision into a prioritized, advisory-only response plan; the Reporting Agent compiles a complete incident report; every action is appended to an audit log. The design prioritizes explainability, human oversight, and zero-dependency operation.",modules:[{name:"Incident Data Module",desc:"18-incident simulated corpus with identity, device, MFA, location, behavior, network and session attributes."},{name:"Cloud Telemetry Module",desc:"9 AWS-style services with deterministic live jitter and an incident-state override (degraded ALB/ECS/RDS)."},{name:"Risk Engine Module",desc:"Pure weighted scoring function + policy mapping + human-readable decision reasons."},{name:"Agent Orchestration Module",desc:"Orchestrator + 5 agents, typed tool system, streamed execution trace."},{name:"Response Module",desc:"P0/P1/P2 advisory containment, remediation, escalation and monitoring recommendations."},{name:"Reporting Module",desc:"Plain-text report generator; MD/HTML/TXT download via Blob."},{name:"Audit Module",desc:"Append-only event log with timestamp, actor, agent, action, incident, result, risk score."},{name:"Presentation Module",desc:"In-app docs, demo script, slide outline; python-pptx deck in deliverables."}],tools:[{name:"get_incident(id)",desc:"Loads the incident record by ID."},{name:"get_cloud_metrics(service)",desc:"Returns simulated telemetry for a service."},{name:"get_application_logs(service)",desc:"Returns recent app-log lines for correlation."},{name:"get_authentication_events(incident)",desc:"Returns auth-log excerpts matching the event signature."},{name:"get_network_events(incident)",desc:"Returns network flow/attack indicators."},{name:"get_user_context(user)",desc:"Identity roles, baseline and prior anomalies."},{name:"get_device_context(incident)",desc:"Device posture and compliance detail."},{name:"calculate_risk(incident)",desc:"Invokes the deterministic risk engine."},{name:"evaluate_zero_trust_policy(score)",desc:"Maps score to policy decision."},{name:"get_recent_incidents(n)",desc:"Cross-incident correlation feed."},{name:"get_service_health()",desc:" Fleet-wide health snapshot."},{name:"get_deployment_history()",desc:"CI/CD events for change correlation."},{name:"generate_incident_report()",desc:"Assembles the full incident report."},{name:"create_audit_log(entry)",desc:"Appends to the audit trail."}],agentWorkflow:`ORCHESTRATION FLOW (per investigation)
────────────────────────────────────────────
incident ──▶ Orchestrator.plan()
              ├─ classify(event_type, severity, service)
              ├─ select chain: cloud-led OR security-led
              └─ emit plan steps
          ──▶ Cloud Analyst.run(incident)        [cloud-led chains]
                tools: get_cloud_metrics, get_application_logs,
                       get_deployment_history, get_service_health
          ──▶ Security Analyst.run(incident)     [identity-led chains]
                tools: get_authentication_events, get_network_events
          ──▶ Zero Trust Agent.run(incident)
                tools: get_user_context, get_device_context,
                       calculate_risk, evaluate_zero_trust_policy
          ──▶ Orchestrator.correlate(evidence…)
          ──▶ Orchestrator.decideRootCause(confidence)
          ──▶ Incident Response Agent.recommend(decision, evidence)
                → P0/P1/P2 advisory plan (human approval gate)
          ──▶ Reporting Agent.compile(report)
          ──▶ audit.append(every step)

Each step streams to the UI in real time and is recorded with
agent, task, detail, duration and result.`,zeroTrust:`ZERO TRUST RISK METHODOLOGY
────────────────────────────────────────────
Seven factors are normalized to 0–100:

  Identity Risk                 weight 0.20
  Device Risk (posture)         weight 0.15
  MFA Risk                      weight 0.10
  Location Risk                 weight 0.10
  Behavior Risk                 weight 0.15
  Network Attack Probability    weight 0.20
  Session Risk                  weight 0.10

score = Σ(factor × weight)  →  rounded to 0–100

Policy bands:
  0–29   LOW      → ALLOW
  30–59  MEDIUM   → ALLOW WITH MONITORING
  60–79  HIGH     → STEP-UP AUTHENTICATION / RESTRICT ACCESS
  80–100 CRITICAL → DENY / ISOLATE / ESCALATE

Why deterministic?
  1. Verifiability — an auditor can recompute any decision.
  2. Reliability — the demo cannot fail due to a missing API key.
  3. Governance — security policy must be explicit, not emergent.
  4. Explainability — every factor shows value × weight = contribution.

The engine is deliberately separated from any ML layer: if a learned
model is added later (e.g. anomaly detection feeding the behavior
factor), it plugs in as ONE input among seven, and policy enforcement
remains deterministic and auditable.`,testCases:[{id:"TC001",input:"INC-1027 low-risk routine login (compliant device, MFA done)",expected:"Risk LOW → ALLOW",actual:"risk 8 → LOW → ALLOW"},{id:"TC002",input:"INC-1040 medium-risk policy violation",expected:"Risk MEDIUM → ALLOW WITH MONITORING",actual:"risk 41 → MEDIUM → ALLOW WITH MONITORING"},{id:"TC003",input:"INC-1037 high-risk impossible-travel login",expected:"Risk HIGH → STEP-UP / RESTRICT",actual:"risk 61 → HIGH → STEP-UP / RESTRICT ACCESS"},{id:"TC004",input:"INC-1042 critical-risk suspicious production login",expected:"Risk CRITICAL → DENY / ISOLATE / ESCALATE",actual:"risk 79 → HIGH → STEP-UP / RESTRICT ACCESS (engine-computed)"},{id:"TC005",input:"INC-1036 DDoS-like traffic spike",expected:"Classification HIGH/CRITICAL",actual:"risk 35 → MEDIUM decision (system identity; network factor dominant) — flagged CRITICAL severity"},{id:"TC006",input:"INC-1033 database saturation",expected:"CLOUD incident path",actual:"Cloud-led investigation chain; root cause = DB saturation"},{id:"TC007",input:"INC-1040 non-compliant device",expected:"RESTRICT + quarantine recommendation",actual:"deviceRisk 90; response includes device quarantine"},{id:"TC008",input:"INC-1042 credential compromise",expected:"ISOLATE session recommendation",actual:"P0: terminate sessions, block IP, disable account"}],limitations:["All data is simulated; no connection to real AWS/Azure/production telemetry.","The risk engine uses fixed weights — it does not learn or adapt from outcomes.","Behavioral baselines are encoded per-incident, not computed from long-term history.","Remediation actions are advisory; no actual API execution or ticketing integration.","Multi-tenancy, RBAC for the app itself, and SSO are out of scope.","Investigation traces use fixed timing for demonstration; production agents would have variable latency.","The incident corpus (18 records) is illustrative, not statistically representative.","No real LLM is required or bundled; the optional LLM hook is a narration-enhancer only."],futureScope:["Integrate real telemetry adapters (CloudTrail, GuardDuty, Okta, Crowdstrike) behind the same tool interface.","Learn risk weights from analyst feedback (approval/rejection of recommendations).","Add an LLM-backed reasoning layer for open-ended root-cause narrative and hypothesis generation.","Graph-based entity correlation (user–IP–device–service) with anomaly propagation.","Automated playbooks with progressive autonomy: read-only → reversible → approval-gated.","MITRE ATT&CK technique enrichment and threat-intel feeds (STIX/TAXII).","SOAR/ticketing integration (Jira, PagerDuty) and email/Slack notifications.","Evaluation harness with labeled attack scenarios and precision/recall reporting."],ethics:["Operates exclusively on clearly-labeled SIMULATED data — no real user, device or cloud data is processed.","Never performs destructive actions: all containment/remediation is advisory and requires human approval.","Never executes arbitrary commands; the agent tool surface is a fixed, typed function set.","Requires no production credentials, secrets or API keys to run.","Deterministic engine prevents silent, unexplainable automated access decisions.","Full audit trail supports accountability and post-hoc review of every agent action.","Explicitly not claimed to be production-ready; intended as an academic demonstration of agentic SOC concepts."],research:[{title:"How AI can support cloud security operations",body:"Security operations generate high-volume, heterogeneous signals (telemetry, auth logs, flows, identity events). AI assists by (1) triaging and prioritizing alerts, (2) extracting structured evidence from unstructured logs, (3) correlating weak signals across domains into coherent incident narratives, and (4) drafting response plans and reports that humans approve. Crucially, AI works best as an investigation accelerator inside a bounded tool system — not as an unsupervised actor with production write-access."},{title:"How agentic systems can automate investigation",body:"Agentic systems differ from chatbots: they maintain state, plan multi-step work, select and invoke tools, and evaluate their own intermediate results. In AegisOps the Orchestrator plans, delegates, correlates and concludes; specialist agents encapsulate domain heuristics (cloud vs security). Streaming traces make the automation observable, and every tool call is auditable — the properties needed for trustable autonomy in security contexts."},{title:"Zero Trust principles in risk-based access decisions",body:"Zero Trust removes implicit trust: every access is evaluated on identity assurance, device posture, MFA strength, location, behavioral consistency and threat context. Risk-based access converts these signals into a continuous score that maps to graduated enforcement (allow → monitor → step-up → deny/isolate). AegisOps implements this as an explicit weighted model so that security policy stays transparent and governable."},{title:"AI reasoning vs deterministic policy enforcement",body:"This project deliberately separates the two. Evidence gathering and narrative construction are agentic tasks; the risk score and access decision are deterministic policy. This mirrors regulated-industry practice: probabilistic systems may inform, but consequential access decisions must be reproducible and explainable. AegisOps therefore never claims its score is an ML output — it is a documented formula, which is a feature, not a limitation, for governance."}],sections:[{title:"Technology Stack",table:[["Layer","Technology","Why"],["Frontend","React 18 + TypeScript + Vite","Component model, static typing, instant dev server"],["Styling","Tailwind CSS","Fast consistent dark SOC theme"],["Charts","Recharts","Declarative SVG charts on React"],["Routing","React Router (hash)","Deployable as static files anywhere"],["State","React Context + append-only audit list","Single source of truth, audit-friendly"],["Data","Typed in-memory datasets","Zero-dependency simulated corpus"],["Risk engine","Pure deterministic functions (vitest-tested)","Auditable, demo-safe"],["Tests","Vitest","Same toolchain as build"],["Docs/Deck","Markdown + python-pptx","Reproducible deliverables"]]},{title:"Data Flow (per investigation)",code:`incident record
  -> Orchestrator.plan()            classify + select agent chain
  -> Cloud Analyst / Security Analyst
       tool calls over simulated telemetry
  -> Zero Trust Agent               normalize 7 factors
  -> Orchestrator.correlate()       cross-domain evidence merge
  -> Risk Engine                    weighted score (0-100)
  -> Policy Engine                  ALLOW/MONITOR/STEP-UP/DENY
  -> IR Agent                       P0/P1/P2 advisory plan
  -> Reporting Agent                downloadable report
  -> Audit Log                      every step appended
  -> UI                             streamed trace panels`},{title:"Database Schema (migration path)",code:`INCIDENTS(incident_id PK, timestamp, title, description, attack_type, event_type, severity, status, user, source_ip, destination_ip, device_id, device_compliance, mfa_status, location, service, identity_risk, behavior_score, network_attack_probability, session_risk, device_risk, mfa_risk, location_risk, risk_score, risk_category, decision, decision_reasons JSON)

CLOUD_SERVICES(id PK, name, type, status, cpu, memory, latency_ms, error_rate, connections, requests_per_min, http_5xx, db_conn_pct, region)

In this build these tables are realized as typed in-memory datasets (src/lib/*.ts) to keep the demo dependency-free; the schema above is the migration path to SQLite/DynamoDB for production work.`},{title:"API Design (production variant)",code:`REST API DESIGN (for the production-style backend variant)

In this client-side build the same operations are implemented as typed functions in src/lib/agents.ts and src/store.tsx, so the UI architecture (and its data contract) is production-shaped.`},{title:"Agent Responsibilities",bullets:["Aegis Orchestrator - incident intake, classification, plan creation, delegation, evidence correlation, root-cause determination with confidence value.","Cloud Analyst - ALB/ECS/EC2/RDS/ECR/IAM/VPC/SG telemetry, application logs, deployment correlation; detects saturation and degradation.","Security Analyst - authentication anomalies, brute-force/stuffing signatures, MFA-fatigue patterns, port scans, DDoS indicators, token misuse.","Zero Trust Agent - factor normalization and invocation of the deterministic risk engine; produces value x weight contribution tables.","Incident Response Agent - maps decision to prioritized containment / remediation / escalation / monitoring; strictly advisory.","Reporting Agent - compiles the AEGISOPS Incident Report (10 sections) used for MD/HTML/TXT download."]},{title:"Testing Methodology",paragraph:"The test suite (vitest) validates the risk engine bands, the policy mapping and the full agentic pipeline end-to-end. Each demo scenario is investigated with the real engine inside the tests, so the app, the report generator and the tests can never disagree about a score. The Testing tab maps TC001-TC008 to results produced by the actual test run.",code:`npm install     # install dependencies
npm test        # run the 11-test vitest suite (TC001-TC008 + integrity)
npm run dev     # start dev server (http://localhost:5173)
npm run build   # production bundle -> dist/
npm run preview # serve the production bundle locally`},{title:"Demo Scenarios",bullets:["SC1 Compromised Credentials (INC-1042) - service-account interactive login, IAM enumeration, full identity-to-isolation flow.","SC2 DDoS / Traffic Spike (INC-1036) - 4.3x traffic, hostile ASN share, SYN-flood signature.","SC3 Non-Compliant Device (INC-1040) - unmanaged workstation reaches production config API.","SC4 Database Saturation (INC-1033) - cloud-led chain tracing DB saturation to API latency.","SC5 Privilege Escalation (INC-1038) - IAM mutation outside change window.","SC6 Combined Cloud + Identity Attack (INC-1028) - credential stuffing synchronized with API abuse."]},{title:"Project Folder Structure",code:`aegisops/

└── deliverables/     AegisOps_Presentation.pptx`},{title:"Setup Instructions",bullets:["Requirements: Node.js 18+ (no cloud account, no API keys).","npm install -> npm run dev -> open http://localhost:5173.","Optional production check: npm run build && npm run preview.","Optional tests: npm test (11 tests incl. TC001-TC008).","All data is simulated; the DEMO MODE badge in the header is always visible."]}]},mv=[{cat:"Agentic AI",q:"What is Agentic AI?",a:"Agentic AI refers to AI systems that autonomously pursue goals by planning multi-step work, selecting and invoking tools, observing results, and adapting — rather than only responding to single prompts. AegisOps demonstrates this with an Orchestrator that plans investigations, delegates to specialist agents, correlates their evidence and concludes with a root cause."},{cat:"Agentic AI",q:"How is AegisOps different from a chatbot?",a:"A chatbot answers text in one turn. AegisOps maintains investigation state, executes a structured multi-step plan, calls typed tools (telemetry, auth logs, risk engine), streams its reasoning trace, produces structured artifacts (score, decision, response plan, report) and records an audit trail. It is a workflow system with AI-style orchestration, not a conversational UI."},{cat:"Agentic AI",q:"Why use multiple specialized agents instead of one?",a:"Separation of concerns: cloud telemetry analysis, security-event analysis, risk scoring, response planning and reporting need different data and heuristics. Specialized agents are independently testable, produce focused evidence, and mirror real SOC team roles. The Orchestrator handles coordination and correlation, keeping each agent simple."},{cat:"Agentic AI",q:"How does the Orchestrator work?",a:"It receives the incident, classifies it (event type, severity, service), selects the investigation chain (cloud-led for infrastructure events, security-led for identity events), emits a plan, delegates to agents, correlates returned evidence, determines the probable root cause with a confidence value, and assembles the final structured result."},{cat:"Agentic AI",q:"What happens if the AI model is unavailable?",a:"Nothing breaks. All core reasoning — risk scoring, classification, root cause selection, recommendations — is deterministic code. The optional LLM hook only enriches narration and falls back silently. This was a deliberate design requirement for reliable demonstrations."},{cat:"Agentic AI",q:"What tools does the agent system expose?",a:"A fixed set of typed functions: get_incident, get_cloud_metrics, get_application_logs, get_authentication_events, get_network_events, get_user_context, get_device_context, calculate_risk, evaluate_zero_trust_policy, get_recent_incidents, get_service_health, get_deployment_history, generate_incident_report, create_audit_log."},{cat:"AI",q:"Is an ML model used for risk scoring?",a:"No — deliberately. The score is a transparent weighted sum of seven normalized factors. Security policy must be auditable and reproducible; a black-box model cannot be re-computed by an auditor. ML can later feed individual factors (e.g. behavior anomaly detection) while policy enforcement stays deterministic."},{cat:"AI",q:"Where could machine learning genuinely help this system?",a:"Behavioral anomaly detection (per-user baselines), alert clustering/deduplication, false-positive suppression learned from analyst feedback, and natural-language report summarization. Each would feed the existing factor inputs rather than replace the policy engine."},{cat:"AI",q:"What is explainable AI and how does AegisOps implement it?",a:"Explainable AI means a human can understand why a system produced an output. AegisOps shows every factor value, its weight, its numeric contribution, and human-readable reasons; the decision band mapping is published. Any score can be recomputed by hand."},{cat:"Machine Learning",q:"Why is a deterministic engine a research-valid choice?",a:"Because it separates learning from governance. The literature on high-stakes automated decisions recommends deterministic, auditable enforcement with probabilistic components confined to estimation. AegisOps implements that separation explicitly: agents estimate, policy decides."},{cat:"Cybersecurity",q:"What is Zero Trust?",a:"A security model that removes implicit trust: every access request is verified using identity, device posture, context and behavior, regardless of network location. Principles: verify explicitly, use least-privilege access, and assume breach."},{cat:"Zero Trust",q:"How is risk calculated in AegisOps?",a:"Seven factors (identity, device, MFA, location, behavior, network attack probability, session) are normalized to 0–100 and combined with weights 0.20/0.15/0.10/0.10/0.15/0.20/0.10. The result maps to LOW/MEDIUM/HIGH/CRITICAL and then to ALLOW / MONITOR / STEP-UP / DENY-ISOLATE."},{cat:"Zero Trust",q:"Why these weights?",a:"They reflect typical conditional-access practice: identity and network context are the strongest compromise indicators (20% each), device posture and behavior are strong secondary signals (15% each), and MFA, location and session state contribute 10% each. The weights are configuration, not dogma — they are exposed so they can be tuned by policy owners."},{cat:"Zero Trust",q:"What is step-up authentication?",a:"Requiring a stronger verification factor (fresh MFA challenge, re-authentication) before granting or continuing access when risk is elevated but not critical — AegisOps recommends it for HIGH (60–79) scores."},{cat:"Zero Trust",q:"What is MFA fatigue?",a:"An attack where the adversary spams push-notification approvals until the user accepts out of confusion or habit. Incident INC-1035 simulates 17 denials followed by one approval — a strong compromise indicator."},{cat:"Cybersecurity",q:"What is impossible travel?",a:"Two authentications from geographically distant locations within a time window shorter than physically possible travel. It strongly indicates credential compromise — simulated in INC-1037 (Pune → Frankfurt in 11 minutes)."},{cat:"Cybersecurity",q:"What is credential stuffing vs brute force?",a:"Brute force guesses passwords against one account; credential stuffing replays username/password pairs from breached datasets across many accounts. INC-1041 simulates brute force; INC-1026 simulates stuffing (many accounts, breached-password indicators)."},{cat:"Cybersecurity",q:"What is the kill chain / ATT&CK?",a:"Frameworks describing attack stages — reconnaissance, initial access, execution, privilege escalation, etc. AegisOps maps its incident corpus to ATT&CK tactics on the Security Analytics page (Credential Access, Discovery, Privilege Escalation, Impact, Exfiltration)."},{cat:"Cybersecurity",q:"Difference between IDS and IPS?",a:"IDS detects and alerts on malicious traffic; IPS sits inline and actively blocks it. AegisOps is advisory (like an investigation layer above both) — it never blocks anything itself."},{cat:"Cybersecurity",q:"What is least privilege?",a:"Granting only the permissions required for a task, for the minimum time needed. AegisOps mirrors it by recommending scope reduction (read-only restriction, TTL rotation of keys) and by keeping its own response actions advisory."},{cat:"Cloud / AWS",q:"Why simulate AWS telemetry instead of connecting to real AWS?",a:"Three reasons: (1) safety — a student project must never touch production infrastructure; (2) reproducibility — the demo works offline, anywhere, without credentials or cost; (3) determinism — a viva demo cannot depend on live cloud state. The tool interface is designed so real adapters (CloudTrail, GuardDuty) can replace the simulators later."},{cat:"Cloud / AWS",q:"How is the system not directly connected to AWS?",a:"All telemetry comes from local typed datasets with deterministic jitter. There is no AWS SDK, no credentials, no network calls. The simulated environment mirrors AWS service semantics (ALB, ECS Fargate, RDS, ECR, IAM, VPC, Security Groups) so the analysis logic is transferable."},{cat:"Cloud / AWS",q:"What is an ALB and what does a 5xx rate indicate?",a:"An Application Load Balancer distributes HTTP(S) traffic across targets. A rising 5xx rate means the backend is failing requests — in AegisOps the simulated spike (7.2%) is traced to database connection saturation upstream of the API tier."},{cat:"Cloud / AWS",q:"What is ECS/Fargate?",a:"AWS Elastic Container Service runs containers; Fargate is its serverless compute mode where AWS manages the instances. The simulated prod-api-service runs as 6 Fargate tasks whose CPU/memory/latency the Cloud Analyst inspects."},{cat:"Cloud / AWS",q:"What is RDS connection saturation and why does it cause API latency?",a:"RDS enforces a max_connections limit. When the pool is exhausted (simulated at 91%), requests queue waiting for a connection — each wait adds directly to API response time, cascading into ALB 5xx errors. This is the root cause demonstrated in INC-1033/INC-1039."},{cat:"Cloud / AWS",q:"What is a Security Group?",a:"A stateful virtual firewall controlling inbound/outbound traffic at the instance level in a VPC. The simulated sg-prod-api allows 443 and 8443; the port-scan incident probes the public subnet it protects."},{cat:"Cloud / AWS",q:"What is IAM and why is privilege escalation dangerous there?",a:"AWS Identity and Access Management controls who can do what. Escalation attempts (iam:CreateRole, AttachUserPolicy) can grant persistent, broad permissions — INC-1038 simulates one blocked by a Service Control Policy."},{cat:"Architecture",q:"Walk through the system architecture.",a:"UI (React/TS) → Orchestrator Agent → specialized agents → typed tool layer → simulated data store → deterministic risk engine → Zero Trust policy → advisory response → audit + reporting. Everything runs client-side; the layering matches how a production backend would be split."},{cat:"Architecture",q:"Why client-side only? Where is the backend?",a:"For this scope, a separate server adds deployment risk and credit cost without adding capability: the data is simulated and the reasoning is deterministic. The API design document specifies the REST contract for a production variant; the frontend already consumes it through the same function signatures."},{cat:"Architecture",q:"What is the data flow for one investigation?",a:"Incident → Orchestrator plan → agent tool calls (cloud/auth/network/identity) → evidence arrays → factor normalization → weighted score → policy decision → response plan → report → every step appended to the audit log and streamed to the UI."},{cat:"Software Engineering",q:"Why TypeScript?",a:'Static types encode the incident/risk/investigation contracts, catch integration errors at compile time, and make the tool system self-documenting — important when the "API" is a set of agent tools.'},{cat:"Software Engineering",q:"How is the code tested?",a:"Vitest unit tests cover the risk engine bands (TC001–TC004), policy mapping, and end-to-end scenario expectations (TC005–TC008) — each test computes the score with the real engine. The Testing page maps test cases to actual executed results."},{cat:"Software Engineering",q:"How do you prevent destructive automated actions?",a:"The Incident Response Agent only produces recommendations with priorities. There is no execution layer, no credentials, and no command execution. High-impact actions display an explicit human-approval gate — mirroring real SOC change control."},{cat:"Project-specific",q:"What was YOUR contribution vs generated scaffolding?",a:"Frame honestly: the architecture design, risk model, agent decomposition, scenario design, UI/UX decisions and documentation are the project work; code generation accelerated implementation. Be ready to explain every module (the How It Works and Architecture pages support this)."},{cat:"Project-specific",q:"What is the hardest problem you solved?",a:"Making agentic behavior observable and reliable at once: streaming traces that never stall (timed deterministic steps), plus keeping every displayed score computed from one engine so the UI, tests and reports can never disagree."},{cat:"Project-specific",q:"Why is the INC-1042 score not exactly 78?",a:"The specification gave an example, not a contract. The engine computes 0.20·82 + 0.15·90 + 0.10·80 + 0.10·75 + 0.15·77 + 0.20·71 + 0.10·74 = 78.55 → 79, and that value is displayed everywhere INC-1042 appears — UI, report, audit log and tests all read from the same engine, so they can never disagree."},{cat:"Project-specific",q:"How would you productionize this?",a:"Move the tool layer behind REST endpoints backed by real telemetry adapters, persist to a database, add auth (SSO/RBAC), stream traces over WebSockets, add an LLM reasoning service with guardrails, and build an evaluation harness with labeled attack scenarios before enabling any autonomous action."},{cat:"Cybersecurity",q:"What is lateral movement?",a:"An attacker expanding access from an initial foothold to other systems/identities. AegisOps watches for its precursors: enumeration API calls after login (INC-1042), unusual IAM mutations (INC-1031), and cross-service token misuse (INC-1034)."},{cat:"Agentic AI",q:"What is the agent loop (observe–think–act)?",a:"The classic autonomy cycle: perceive state, reason about the next best action, act via tools, observe the result, repeat until the goal is met. AegisOps runs this once per investigation with fixed agents; the trace panel makes each cycle visible."},{cat:"Zero Trust",q:"What is device posture / compliance?",a:"The security state of an endpoint: EDR present, disk encrypted, OS patched, managed by MDM. AegisOps treats FAILED posture as a heavy risk input (90/100) and recommends quarantine before re-access."},{cat:"Cloud / AWS",q:"What is a VPC?",a:"Virtual Private Cloud — a logically isolated network in AWS with subnets, route tables and gateways. The simulated prod-vpc (10.0.0.0/16) hosts the public ALB subnet and private compute/data subnets."},{cat:"AI",q:"How does the system classify incidents?",a:"Deterministically: by event_type field plus severity and service, using a rule table. The classification drives agent-chain selection and the root-cause template — auditable and testable, unlike a probabilistic classifier."}],$l=[{title:"Open the dashboard",seconds:25,say:"Introduce AegisOps as an autonomous cloud security and incident response agent. Point at the six KPI cards and the charts — emphasize every number is engine-computed from simulated data."},{title:"Show active incidents",seconds:25,say:"Open Incidents. Show the filter bar: search, severity, status, attack type, minimum risk. Point out 18 realistic incidents: brute force, DDoS, impossible travel, MFA fatigue, privilege escalation."},{title:"Select the critical incident",seconds:20,say:"Open INC-1042 — Suspicious Production Login. Read the overview: service account, interactive login, non-compliant device, MFA not completed."},{title:'Click "Investigate with AegisOps"',seconds:30,say:"The agent chain starts. Narrate the streaming trace: Orchestrator plans → Security Analyst reads auth events → Zero Trust Agent computes risk → correlation → root cause → response → report."},{title:"Show evidence",seconds:25,say:"Walk the evidence columns: identity 82/100, device FAILED, MFA not completed, unusual location, network attack probability 71. Explain cross-signal correlation."},{title:"Show the Zero Trust risk score",seconds:25,say:"Open the Zero Trust panel: radar chart of seven factors and the exact arithmetic — each factor × its weight = contribution, summed to the final score. Stress: fully explainable, no black box."},{title:"Show the decision",seconds:20,say:"The policy band maps the score to the access decision and lists the reasons that triggered it."},{title:"Show recommended remediation",seconds:25,say:"P0/P1/P2 response plan: terminate sessions, block IP, restrict account, enforce MFA, investigate source IP. Emphasize: advisory only, human approval required."},{title:"Generate the report",seconds:20,say:"Open Reports, show the AEGISOPS Incident Report and download it as Markdown/HTML."},{title:"Wrap up on audit trail",seconds:25,say:"Open Audit Logs — every agent action is recorded with timestamp, actor, result. Close with: human oversight, deterministic policy, demo-mode repeatability."}],go=[{title:"AegisOps — Autonomous Cloud Security & Incident Response Agent",bullets:["Agentic AI platform for autonomous cloud-security investigation","Simulated AWS-style telemetry · deterministic Zero Trust engine · human oversight","MCA final project — live demonstration included"],notes:"Good morning. I present AegisOps, an agentic AI platform that autonomously investigates cloud security incidents. It coordinates specialist agents over simulated AWS-style telemetry, scores risk with an explainable Zero Trust engine, and recommends response actions under human oversight. Everything you will see runs live with no cloud credentials and no external AI dependency."},{title:"Problem Statement",bullets:["SOC teams face alert fatigue — thousands of signals per day across silos","Investigations are manual: analysts pivot between consoles and correlate ad-hoc","Risk triage is inconsistent; decisions lack explainable quantification","Dashboards display data — they do not investigate"],notes:"Modern SOC teams drown in alerts from cloud telemetry, authentication logs and network flows. Investigation is manual: analysts switch between tools, correlate evidence by hand, and apply inconsistent risk judgment. Existing dashboards show data but never investigate. That gap is the problem AegisOps addresses."},{title:"Motivation",bullets:["Agentic AI is moving from chat to multi-step autonomous workflows","Cloud incidents demand cross-domain correlation: identity + device + network + infrastructure","Security decisions must remain auditable — explainability is not optional","Ideal intersection of my AI and cloud-security coursework"],notes:"Three motivations: agentic AI has matured into reliable multi-step workflows; cloud incidents span identity, device, network and infrastructure domains that no single tool correlates; and security decisions demand explainability. AegisOps sits exactly at this intersection of AI and cloud security."},{title:"Objectives",bullets:["Multi-agent architecture: Orchestrator + 5 specialized agents","Explainable deterministic Zero Trust risk engine (7 weighted factors)","Realistic simulated AWS telemetry — zero real credentials","Observable agentic behavior: streamed traces + per-agent audit","Report generation, audit trail, one-click demo scenarios"],notes:"Six objectives: build a multi-agent architecture with an Orchestrator and five specialists; implement an explainable weighted Zero Trust engine; simulate realistic AWS telemetry without credentials; make agent behavior observable; generate professional reports with a full audit trail; and package one-click demo scenarios for evaluation."},{title:"Existing System & Limitations",bullets:["SIEM (Splunk/QRadar): aggregation + display; investigation stays manual","SOAR: rigid pre-defined playbooks, little contextual reasoning","Cloud-native findings (GuardDuty, Security Hub): per-service, no cross-domain correlation","None produce an explainable risk-based access decision"],notes:"SIEMs aggregate logs but investigation stays manual. SOAR platforms execute rigid playbooks without contextual reasoning. Cloud-native dashboards surface per-service findings with no cross-domain correlation. None of them produce an explainable risk-based access decision — that is the gap."},{title:"Proposed System",bullets:["Agentic investigation: OBSERVE → INVESTIGATE → CORRELATE → REASON → DECIDE → RESPOND → EXPLAIN → AUDIT","Typed tool system shared by all agents","Deterministic risk engine + Zero Trust policy bands","Advisory-only response with human approval gate"],notes:"AegisOps proposes a layered agentic platform. The Orchestrator plans each investigation and delegates to specialist agents that query a shared tool system. Evidence is correlated, scored by a deterministic weighted engine, mapped to a Zero Trust policy decision, and converted into an advisory response plan. Every action is audited. The pipeline: observe, investigate, correlate, reason, decide, respond, explain, audit."},{title:"System Architecture",bullets:["UI (React + TypeScript) → Orchestrator → Specialized Agents → Tool Layer → Simulated Data","Risk Engine → Zero Trust Decision → Incident Response → Audit + Reporting","Fully client-side; REST-equivalent function contracts documented"],notes:"The architecture flows from the UI to the Orchestrator, then to specialized agents, a typed tool layer, and the simulated data store. Results pass through the deterministic risk engine to the Zero Trust decision, the advisory response layer, and finally audit and reporting. The whole system is client-side, with the REST contract documented for a production variant."},{title:"Agentic AI Architecture",bullets:["Aegis Orchestrator — plans, delegates, correlates, concludes","Cloud Analyst — ALB/ECS/EC2/RDS telemetry, logs, deployments","Security Analyst — auth events, network signatures","Zero Trust Agent — 7-factor risk normalization","Incident Response + Reporting Agents — advisory plan, report"],notes:"Six agents. The Orchestrator plans, delegates, correlates and concludes. The Cloud Analyst inspects ALB, ECS and RDS telemetry plus logs and deployments. The Security Analyst reads authentication events and network signatures. The Zero Trust Agent normalizes seven risk factors. The Incident Response Agent drafts the advisory plan; the Reporting Agent compiles the report. Each agent is a typed, independently testable module."},{title:"Zero Trust Risk Engine",bullets:["score = 0.20·identity + 0.15·device + 0.10·MFA + 0.10·location + 0.15·behavior + 0.20·network + 0.10·session","0–29 LOW→ALLOW · 30–59 MEDIUM→MONITOR · 60–79 HIGH→STEP-UP · 80–100 CRITICAL→DENY/ISOLATE","Every factor displayed: value × weight = contribution"],notes:"The engine combines seven normalized factors with explicit weights — identity and network at twenty percent each, device and behavior at fifteen, MFA, location and session at ten. Bands map the score to allow, monitor, step-up, or deny-and-isolate. The UI always shows the exact arithmetic, so any decision can be recomputed by hand. This is deliberate: governance requires transparency, not black boxes."},{title:"Cloud Security Investigation Workflow",bullets:["Security-led chain: auth events → network signals → risk → decision","Cloud-led chain: ALB → ECS → logs → deployments → DB metrics","Example: latency spike traced to DB connection saturation; no deployment correlation"],notes:"Two investigation chains. Identity events run security-led: authentication events, then network signals, then risk. Infrastructure events run cloud-led: ALB metrics, ECS metrics, application logs, deployment history, then database metrics. In the demo, a latency spike is traced through this chain to database connection saturation — and deployment correlation rules out a bad release."},{title:"Application Screens — SOC Dashboard",bullets:["6 KPI cards · severity/attack/risk/decision charts · incident table","9 pages: Overview, Incidents, Investigations, Zero Trust, Cloud, Analytics, Agents, Reports, Audit","Dark SOC theme, professional charts (Recharts)"],notes:"The dashboard shows six KPI cards, charts for severity, attack types, risk distribution and access decisions, and the incident table with one-click investigation. Nine pages cover incidents, investigations, Zero Trust, cloud infrastructure, analytics, agent activity, reports and audit — all in a dark SOC theme."},{title:"Live Demo — Incident Investigation",bullets:["INC-1042 suspicious production login → one click","Streaming agent trace with per-step detail and duration","Evidence, risk decomposition, decision, P0–P2 response plan"],notes:"Now the live demonstration. I open INC-1042, click Investigate, and narrate the streaming trace as agents work. Evidence: identity risk 82, non-compliant device, MFA not completed, unusual location. The engine computes the score, the policy selects the decision, and the response plan appears as prioritized recommendations. [Run the 5-minute demo script here.]"},{title:"Results & Expected Benefits",bullets:["End-to-end autonomous investigation in ~8 seconds, 11 steps, 6 agents","100% of test cases pass (TC001–TC008, automated vitest suite)","Zero external dependencies for the core demo — fully reproducible","Consistent, explainable triage; analyst time redirected to judgment"],notes:"Results: a complete investigation runs in about eight seconds across eleven agent steps; all eight automated test cases pass because the engine is deterministic; and the demo needs zero external services, so it is perfectly reproducible. The expected benefit in a real SOC is consistent, explainable triage that frees analyst time for judgment calls."},{title:"Limitations & Future Scope",bullets:["Simulated data · fixed weights · advisory-only actions (by design)","Future: real telemetry adapters, learned weights, LLM reasoning layer, SOAR/ticketing integration","Evaluation harness with labeled attack scenarios"],notes:"Limitations are deliberate: simulated data, fixed weights, advisory-only actions. Future scope: real telemetry adapters behind the same tool interface, weights learned from analyst feedback, an LLM reasoning layer with guardrails, SOAR and ticketing integration, and a labeled evaluation harness to measure precision and recall."},{title:"Conclusion",bullets:["Demonstrates agentic AI applied to a real security-operations problem","Explainability + human oversight + full auditability as first-class requirements","Thank you — questions welcome"],notes:"To conclude: AegisOps demonstrates how agentic AI can accelerate security investigation while keeping policy deterministic, actions human-approved, and every step audited. It is an academic demonstration of the pattern, not a production SOC. Thank you — I welcome your questions."}],one=[{id:"overview",label:"Project Overview",icon:GC},{id:"academics",label:"Academic Structure",icon:yy},{id:"docs",label:"Full Documentation",icon:VC},{id:"agents",label:"Agent Workflow",icon:ZO},{id:"zerotrust",label:"Zero Trust Methodology",icon:a$},{id:"research",label:"Research Notes",icon:tx},{id:"testing",label:"Testing",icon:tx},{id:"limits",label:"Limitations & Future Scope",icon:P_},{id:"security",label:"Security & Ethics",icon:gy}],gS=[...new Set(mv.map(e=>e.cat))];function sne(){const[e,t]=P.useState("overview"),[n,r]=P.useState("All");return c.jsxs("div",{className:"space-y-4",children:[c.jsxs("div",{children:[c.jsx("h1",{className:"text-xl font-bold text-white",children:"Documentation"}),c.jsx("p",{className:"text-xs text-aegis-muted mt-1",children:"Complete MCA-level project documentation, mirrored from the docs/ folder of the source distribution."})]}),c.jsx("div",{className:"flex gap-1 overflow-x-auto pb-1",children:one.map(i=>c.jsxs("button",{onClick:()=>t(i.id),className:`whitespace-nowrap px-3 py-1.5 rounded-md text-xs border ${e===i.id?"bg-aegis-panel2 text-aegis-accent border-aegis-border":"text-aegis-muted border-transparent hover:text-slate-200"}`,children:[c.jsx(i.icon,{className:"h-3.5 w-3.5 inline mr-1.5"}),i.label]},i.id))}),e==="overview"&&c.jsxs("div",{className:"space-y-4",children:[c.jsxs(K,{className:"p-5",children:[c.jsx(Z,{children:"Project Description"}),c.jsx("p",{className:"text-sm text-slate-300 leading-relaxed",children:vt.description})]}),c.jsxs("div",{className:"grid lg:grid-cols-2 gap-4",children:[c.jsxs(K,{className:"p-5",children:[c.jsx(Z,{children:"Problem Statement"}),c.jsx("p",{className:"text-sm text-slate-300 leading-relaxed",children:vt.problem})]}),c.jsxs(K,{className:"p-5",children:[c.jsx(Z,{children:"Objectives
